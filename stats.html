<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Circumstance — usage</title>
<style>
  :root { --paper: #f4f0e6; --ink: #b6412e; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font-family: ui-monospace, Menlo, monospace; }
  .page { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 14px; font-weight: 500; letter-spacing: 0.12em; margin: 0 0 20px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  input, select, button { font: inherit; font-size: 13px; color: var(--ink);
    background: none; border: 1.5px solid var(--ink); border-radius: 6px; padding: 7px 10px; }
  button { cursor: pointer; border-radius: 999px; padding: 7px 16px; }
  .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
  .card { border: 2px solid var(--ink); border-radius: 10px; padding: 14px; }
  .card b { display: block; font-size: 26px; font-weight: 500; }
  .card span { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; }
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 120px;
           border-bottom: 2px solid var(--ink); margin-bottom: 6px; }
  .bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
  .bar .o { background: var(--ink); border-radius: 2px 2px 0 0; }
  .bar .r { background: #333c54; border-radius: 2px; }
  .legend { font-size: 11.5px; display: flex; gap: 16px; margin-bottom: 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
              vertical-align: -1px; margin-right: 5px; font-style: normal; }
  .axis { display: flex; justify-content: space-between; font-size: 10.5px; }
  #msg { font-size: 13px; min-height: 1.4em; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="page">
  <h1>CIRCUMSTANCE — USAGE</h1>
  <div class="row">
    <input id="worker" placeholder="worker URL" size="28">
    <input id="key" placeholder="key" size="10" type="password">
    <select id="days"><option>7</option><option selected>30</option><option>90</option></select>
    <button id="go">Check in</button>
  </div>
  <div id="msg"></div>
  <div class="cards" id="cards" hidden>
    <div class="card"><b id="nPlayers"></b><span>players</span></div>
    <div class="card"><b id="nReturning"></b><span>came back</span></div>
    <div class="card"><b id="nRecordings"></b><span>recordings</span></div>
    <div class="card"><b id="nOpens"></b><span>opens</span></div>
  </div>
  <div id="chartwrap" hidden>
    <div class="legend"><span><i style="background:var(--ink)"></i>opens</span><span><i style="background:#333c54"></i>recordings</span></div>
    <div class="chart" id="chart"></div>
    <div class="axis"><span id="d0"></span><span id="d1"></span></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
$("worker").value = localStorage.getItem("circWorker") || "https://misty-dew-73be.uglywalks.workers.dev";
$("key").value = localStorage.getItem("circStatsKey") || "";

async function load() {
  const base = $("worker").value.replace(/\/+$/, "");
  const key = $("key").value.trim();
  localStorage.setItem("circWorker", base);
  localStorage.setItem("circStatsKey", key);
  $("msg").textContent = "Fetching\u2026";
  try {
    const r = await fetch(base + "/stats?days=" + $("days").value + "&k=" + encodeURIComponent(key));
    if (!r.ok) throw new Error(r.status === 403 ? "wrong key" : "HTTP " + r.status);
    const d = await r.json();
    $("msg").textContent = "";
    $("nPlayers").textContent = d.players;
    $("nReturning").textContent = d.returning;
    $("nRecordings").textContent = d.recordings;
    $("nOpens").textContent = d.days.reduce((a, x) => a + x.opens, 0);
    $("cards").hidden = false;

    // continuous day axis, empty days included
    const byDay = Object.fromEntries(d.days.map(x => [x.day, x]));
    const out = [];
    const end = new Date();
    for (let i = d.rangeDays - 1; i >= 0; i--) {
      const day = new Date(end - i * 86400000).toISOString().slice(0, 10);
      out.push(byDay[day] || { day, opens: 0, recordings: 0 });
    }
    const max = Math.max(1, ...out.map(x => x.opens + x.recordings));
    $("chart").innerHTML = out.map(x =>
      `<div class="bar" title="${x.day}: ${x.opens} opens, ${x.recordings} recordings">` +
      `<div class="o" style="height:${(x.opens / max) * 110}px"></div>` +
      `<div class="r" style="height:${(x.recordings / max) * 110}px"></div></div>`
    ).join("");
    $("d0").textContent = out[0].day;
    $("d1").textContent = out[out.length - 1].day;
    $("chartwrap").hidden = false;
  } catch (e) {
    $("msg").textContent = "Couldn't fetch: " + (e.message || e);
  }
}
$("go").addEventListener("click", load);
if ($("key").value) load();
</script>
</body>
</html>
