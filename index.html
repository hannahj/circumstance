<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ece6d7">
<title>Circumstance</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="booting">

<div class="page">
  <header>
    <div class="brand">CIRCUMSTANCE<span class="devbadge" id="counter"></span></div>
    <nav class="settings">
      <button id="infoBtn" aria-label="info"><svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="9.5" fill="none" stroke="var(--ink)" stroke-width="2"/><circle cx="12" cy="7.6" r="1.4" fill="var(--ink)"/><path d="M12 11v6" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <button id="gearBtn" aria-label="settings"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M19.4 13c.04-.32.06-.65.06-1s-.02-.68-.06-1l2.1-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.48 1a7.6 7.6 0 0 0-1.73-1l-.37-2.65A.5.5 0 0 0 13.93 2h-4a.5.5 0 0 0-.5.42l-.36 2.65c-.63.26-1.21.6-1.74 1l-2.48-1a.5.5 0 0 0-.6.22l-2 3.46a.5.5 0 0 0 .12.64L4.5 11c-.04.32-.06.65-.06 1s.02.68.06 1l-2.09 1.65a.5.5 0 0 0-.12.64l2 3.46c.12.22.38.31.6.22l2.48-1c.53.4 1.11.74 1.74 1l.36 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65a7.6 7.6 0 0 0 1.73-1l2.48 1c.22.09.48 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64L19.4 13Zm-7.4 2.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2Z" fill="var(--ink)"/></svg></button>
    </nav>
  </header>

  <div class="field">
  <div class="grid" id="grid"></div>

  <footer>
    <div class="almanac"><div class="status" id="status"></div></div>
    <button class="read" id="readBtn" aria-label="record"><span class="rec-word">REC</span><svg viewBox="0 0 14 14" width="13" height="13"><circle cx="7" cy="7" r="6" fill="var(--ink)"/></svg></button>
  </footer>
  </div>

  <div class="lower">
    <div class="repeats" id="repeats"></div>
  </div>
</div>

<div class="overlay capture" id="captureOverlay">
  <button class="close" id="capClose" aria-label="close">&#215;</button>
  <video id="viewfinder" autoplay playsinline muted></video>
  <div class="prime" id="primeCard"></div>
  <div class="capthint">HOLD TO RECORD</div>
  <div class="ritual">
    <svg class="ring" id="ring" viewBox="-100 -100 200 200"></svg>
  </div>
  <canvas id="wave" width="600" height="88"></canvas>
</div>

<div class="overlay" id="noteOverlay">
  <button class="close" aria-label="close">&#215;</button>
  <div class="note" id="noteText"></div>
</div>

<div class="overlay photo" id="photoOverlay">
  <button class="close" aria-label="close">&#215;</button>
  <img id="photoFull" alt="capture photo">
  <video id="clipFull" playsinline controls></video>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
