<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0e6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Circumstance</title>
</head>
<body class="booting">
<div class="page">
  <header>
    <div class="title">CIRCUMSTANCE</div>
    <div class="counter" id="counter">0 / 64</div>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    <div class="almanac">
      <svg id="arc" viewBox="0 0 200 50" aria-label="today's sun arc"></svg>
      <div class="status" id="status"></div>
    </div>
    <button class="read" id="readBtn">TAKE<br>READING</button>
  </footer>

  <div class="repeats" id="repeats"></div>
</div>

<div class="overlay" id="introOverlay">
  <div class="intro-title">CIRCUMSTANCE</div>
  <div class="note">Take this outside to play.
Fill it slowly.

Everything you record here — readings, photos, sound — stays on your device. Nothing is uploaded, ever.</div>
  <button class="read" id="beginBtn">TAKE<br>READING</button>
</div>

<div class="overlay" id="revealOverlay">
  <button class="close" aria-label="close">&#215;</button>
  <div class="reveal-coin" id="revealCoin"></div>
  <div class="reveal-glyphs" id="revealGlyphs"></div>
  <div class="note">Reading taken</div>
</div>

<div class="overlay capture" id="captureOverlay">
  <button class="close" id="capClose" aria-label="close">&#215;</button>
  <video id="viewfinder" autoplay playsinline muted></video>
  <div class="prime" id="primeCard"></div>
  <div class="capthint">tap to begin</div>
  <div class="ritual">
    <svg class="ring" id="ring" viewBox="-100 -100 200 200"></svg>
  </div>
  <canvas id="wave" width="600" height="88"></canvas>
  <div class="cap-toggles">
    <button class="tbtn" id="camTog" aria-label="camera"></button>
    <button class="tbtn" id="micTog" aria-label="microphone"></button>
  </div>
</div>

<div class="overlay" id="noteOverlay">
  <button class="close" aria-label="close">&#215;</button>
  <div class="note" id="noteText"></div>
</div>

<div class="overlay" id="photoOverlay">
  <button class="close" aria-label="close">&#215;</button>
  <img id="photoFull" alt="capture photo">
</div>

<div class="sheet" id="cellSheet">
  <div class="sheet-head" id="sheetHead"></div>
  <div id="sheetBody"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
