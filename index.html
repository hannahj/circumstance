<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0e6">
<title>Circumstance</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="booting">

<div class="page">
  <div class="devbadge" id="counter"></div>

  <div class="grid" id="grid"></div>

  <footer>
    <div class="almanac"><div class="status" id="status"></div></div>
    <button class="read" id="readBtn" aria-label="record"><span class="rec-word">REC</span><svg viewBox="0 0 14 14" width="13" height="13"><circle cx="7" cy="7" r="6" fill="var(--ink)"/></svg></button>
  </footer>

  <div class="repeats" id="repeats"></div>
</div>

<div class="overlay capture" id="captureOverlay">
  <button class="close" id="capClose" aria-label="close">&#215;</button>
  <video id="viewfinder" autoplay playsinline muted></video>
  <div class="prime" id="primeCard"></div>
  <div class="capthint">TAP TO RECORD</div>
  <div class="ritual">
    <svg class="ring" id="ring" viewBox="-100 -100 200 200"></svg>
  </div>
  <canvas id="wave" width="600" height="88"></canvas>
</div>

<div class="overlay" id="noteOverlay">
  <button class="close" aria-label="close">&#215;</button>
  <div class="note" id="noteText"></div>
</div>

<div class="overlay photo" id="photoOverlay">
  <button class="close" aria-label="close">&#215;</button>
  <img id="photoFull" alt="capture photo">
</div>

<script type="module" src="app.js"></script>
</body>
</html>
